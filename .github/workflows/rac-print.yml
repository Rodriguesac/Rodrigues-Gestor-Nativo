name: RAC Print - APK e Receptor Windows
on:
  push:
    branches: [rac-print]
    paths:
      - 'rac-print/**'
      - '.github/workflows/rac-print.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testar protocolo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s rac-print/tests -v

  android:
    name: APK Android
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar APK instalável
        run: gradle --no-daemon -p rac-print/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RAC-Print-Android-APK
          path: rac-print/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Receptor Windows EXE
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar empacotador e bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r rac-print/bridge/requirements.txt pyinstaller==6.16.0
      - name: Empacotar receptor Windows
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RAC-Print-Windows rac-print/bridge/rac_print_bridge.py
      - name: Preparar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pacote -Force
          Copy-Item dist/RAC-Print-Windows.exe pacote/
          Copy-Item rac-print/bridge/INSTALAR-WINDOWS.bat pacote/
          Copy-Item rac-print/COMECE-AQUI.md pacote/
      - uses: actions/upload-artifact@v4
        with:
          name: RAC-Print-Receptor-Windows
          path: pacote/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Downloads diretos RAC Print
    runs-on: ubuntu-latest
    needs: [android, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RAC-Print-Android-APK
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: RAC-Print-Receptor-Windows
          path: release/windows
      - name: Preparar arquivos de instalação
        run: |
          mkdir -p release/dist
          cp release/android/app-debug.apk release/dist/RAC-Print-Android-v0.1.0.apk
          cd release/windows
          zip -j ../dist/RAC-Print-Windows-v0.1.0.zip RAC-Print-Windows.exe INSTALAR-WINDOWS.bat COMECE-AQUI.md
      - name: Publicar downloads na versão RAC Print
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view rac-print-v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload rac-print-v0.1.0 release/dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create rac-print-v0.1.0 release/dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "RAC Print v0.1.0 — Android e Windows" \
              --notes "Versão inicial para testes reais com impressoras Windows. Instale o receptor no PC e o APK no Android. Não validado ainda em impressora física." \
              --prerelease
          fi
