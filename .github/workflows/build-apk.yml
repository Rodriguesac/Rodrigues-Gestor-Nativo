name: Gerar APK Rodrigues Comandos

on:
  workflow_dispatch:
  push:
    branches:
      - "work/rodrigues-comandos-v1"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK necessário
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rodrigues-Comandos-v1.0.0-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Comandos-APK
          path: Rodrigues-Comandos-v1.0.0-debug.apk
          retention-days: 30

      - name: Publicar APK para download direto
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: Rodrigues-Comandos-v1.0.0-debug.apk
          RELEASE_TAG: rodrigues-comandos-v1.0.0
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "Rodrigues Comandos v1.0.0" \
              --notes "APK separado para comandos de voz: pausar/reativar item e abrir/fechar loja via Supabase."
          fi
