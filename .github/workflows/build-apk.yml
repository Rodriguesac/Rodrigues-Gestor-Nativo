name: Gerar APK Rodrigues Gestor

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - work/gestor20rac-parceiros-2026-09-18

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Node para testar interface
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar interface hibrida
        run: |
          npm install --prefix /tmp/gestor-web-tests playwright@1.58.2
          /tmp/gestor-web-tests/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --directory app/src/main/assets/gestor &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH=/tmp/gestor-web-tests/node_modules node scripts/test-hybrid.cjs

      - name: Capturas dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-Hibrido-Interface
          path: hybrid-*.png

      - name: Compilar APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rodrigues-Gestor-v3.2-Hibrido-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Gestor-v3.2-Hibrido-APK
          path: Rodrigues-Gestor-v3.2-Hibrido-debug.apk
          retention-days: 30
