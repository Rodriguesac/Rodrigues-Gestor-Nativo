name: Gerar APK Rodrigues Gestor

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - work/gestor-v3-completo-2026-09-17

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK necessário
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ativar Supabase no Gestor
        run: python3 scripts/patch-supabase-orders.py

      - name: Aplicar recursos v3
        run: python3 scripts/patch-v3-ui.py

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rodrigues-Gestor-v3.0.0-Supabase-Voice-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Gestor-v3-APK
          path: Rodrigues-Gestor-v3.0.0-Supabase-Voice-debug.apk
          retention-days: 30
