name: Gerar APK Rodrigues Gestor

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
      - "work/gestor-voice-v1.3.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK necessário
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rodrigues-Gestor-v1.3.5-Voice-Supabase-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Gestor-Voice-APK
          path: Rodrigues-Gestor-v1.3.5-Voice-Supabase-debug.apk
          retention-days: 30

      - name: Publicar APK para download direto
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: Rodrigues-Gestor-v1.3.5-Voice-Supabase-debug.apk
          RELEASE_TAG: gestor-voice-v1.3.5
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "Rodrigues Gestor v1.3.5 — Voz + Supabase" \
              --notes "APK Android compilado a partir da base v1.3.1, com comando de voz e catálogo dinâmico do Supabase."
          fi
