name: Gerar APK Rodrigues Gestor Hybrid

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "feature/rodrigues-voz-v1", "work/gestor-mobile-refino-2026-09-29" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compilar React compartilhado
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Embutir React no APK
        run: |
          rm -rf app/src/main/assets/web
          mkdir -p app/src/main/assets/web
          cp -R web/dist/. app/src/main/assets/web/

      - name: Baixar modelo de voz PT-BR
        run: |
          rm -rf app/src/main/assets/model-pt
          mkdir -p app/src/main/assets/model-pt
          curl -L --fail --retry 3 -o /tmp/vosk-pt.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          rm -rf /tmp/vosk-pt
          mkdir -p /tmp/vosk-pt
          unzip -q /tmp/vosk-pt.zip -d /tmp/vosk-pt
          cp -R /tmp/vosk-pt/vosk-model-small-pt-0.3/. app/src/main/assets/model-pt/

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK necessário
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $SDKROOT"
            find "$SDKROOT" -name sdkmanager -type f -maxdepth 5 -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ativar pedidos Supabase no serviço nativo
        run: python3 scripts/patch-supabase-orders.py

      - name: Compilar APK híbrido
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rodrigues-Gestor-v3.3.0-Mobile-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Gestor-3.3-Mobile-APK
          path: Rodrigues-Gestor-v3.3.0-Mobile-debug.apk
          retention-days: 30
