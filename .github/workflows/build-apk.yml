name: Gerar APK Rodrigues Gestor Hybrid

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "codex/gestor-3.1" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compilar React compartilhado
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Validar telas no navegador
        working-directory: web
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist &
          node tests/smoke.cjs

      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-3.1-Telas
          path: web/qa-*.png
          if-no-files-found: ignore

      - name: Embutir React no APK
        run: |
          rm -rf app/src/main/assets/web
          mkdir -p app/src/main/assets/web
          cp -R web/dist/. app/src/main/assets/web/

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK necessário
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $SDKROOT"
            find "$SDKROOT" -name sdkmanager -type f -maxdepth 5 -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ativar pedidos Supabase no serviço nativo
        run: python3 scripts/patch-supabase-orders.py

      - name: Compilar APK híbrido
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rodrigues-Gestor-v3.1.0.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Gestor-3.1-APK
          path: Rodrigues-Gestor-v3.1.0.apk
          retention-days: 30


      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar abertura no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Guardar relatório Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-3.1-Testes-Android
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
