name: Validar Gestor20 nativo sem gerar APK

on:
  push:
    branches:
      - feature/gestor20-completo-sem-apk
    paths:
      - "app/**"
      - "scripts/patch-supabase-orders.py"
      - ".github/workflows/validar-gestor20-sem-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Preparar integração existente
        run: python3 scripts/patch-supabase-orders.py

      - name: Compilar apenas Kotlin — sem gerar APK
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Testar valores e validações de pedido manual (JVM)
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Validar ausência de APK gerado
        run: |
          if find app/build/outputs/apk -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "ERRO: este workflow não pode gerar APK."
            exit 1
          fi
          echo "Compilação de código concluída. Nenhum APK foi produzido."
