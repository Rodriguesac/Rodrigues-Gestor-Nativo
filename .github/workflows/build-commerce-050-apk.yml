name: Build Rodrigues Commerce 0.5.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "commerce-0.5.0/**"
      - ".github/workflows/build-commerce-050-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK 36
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct Commerce 0.5.0 source
        run: |
          set -euo pipefail
          rm -rf commerce-app /tmp/commerce050
          mkdir -p /tmp/commerce050
          cat commerce-0.5.0/exact/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/commerce050/source.zip
          echo "6aaf2a4fbe55d069a8c4170ff501c30dd9ca2a3872df5f4acd3fec5244d12212  /tmp/commerce050/source.zip" | sha256sum -c -
          unzip -tq /tmp/commerce050/source.zip
          unzip -q /tmp/commerce050/source.zip -d /tmp/commerce050
          mv /tmp/commerce050/rodrigues-commerce-gestor-base commerce-app

      - name: Generate bundled notification sounds
        working-directory: commerce-app
        run: |
          mkdir -p public/sounds
          python3 - <<'PY'
          import math, struct, wave
          from pathlib import Path
          out = Path("public/sounds")
          rate = 44100
          def write(name, segments):
              samples = []
              for freq, duration, volume in segments:
                  count = int(rate * duration)
                  for i in range(count):
                      if freq <= 0:
                          value = 0
                      else:
                          attack = min(1.0, i / max(1, int(rate * 0.01)))
                          release = min(1.0, (count - i) / max(1, int(rate * 0.03)))
                          envelope = min(attack, release)
                          value = int(32767 * volume * envelope * math.sin(2 * math.pi * freq * i / rate))
                      samples.append(value)
              with wave.open(str(out / name), "wb") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(rate)
                  wav.writeframes(b"".join(struct.pack("<h", s) for s in samples))
          write("old-phone.wav", [(440,.35,.65),(480,.35,.65),(0,.16,0),(440,.35,.65),(480,.35,.65),(0,.16,0),(440,.35,.65),(480,.35,.65)])
          write("chime.wav", [(880,.28,.55),(0,.05,0),(660,.42,.50),(990,.35,.42)])
          write("alert.wav", [(900,.22,.62),(0,.11,0),(900,.22,.62),(0,.11,0),(900,.22,.62),(0,.11,0),(1050,.34,.62)])
          PY

      - name: Install web dependencies
        working-directory: commerce-app
        run: npm install --no-audit --no-fund

      - name: Build React app
        working-directory: commerce-app
        run: npm run build

      - name: Create Android project
        working-directory: commerce-app
        run: npx cap add android

      - name: Add Firebase google-services.json when configured
        working-directory: commerce-app
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
            echo "Firebase configuration added."
          else
            echo "GOOGLE_SERVICES_JSON_B64 not configured. APK will build without closed-app FCM."
          fi

      - name: Sync Capacitor Android
        working-directory: commerce-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: commerce-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          set -euo pipefail
          cp commerce-app/android/app/build/outputs/apk/debug/app-debug.apk Rodrigues-Gestor-0.5.0.apk
          test -s Rodrigues-Gestor-0.5.0.apk
          ls -lh Rodrigues-Gestor-0.5.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Gestor-0.5.0
          path: Rodrigues-Gestor-0.5.0.apk
          if-no-files-found: error
          retention-days: 30
