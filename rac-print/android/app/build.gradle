plugins { id 'com.android.application' }

android {
    namespace 'br.com.rac.print'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.rac.print'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
